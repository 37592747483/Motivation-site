<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Finder</title>
<style>
body{font-family:Georgia,serif;background:#111;color:#eee;margin:0;padding:32px 20px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:28px;margin:0 0 8px}
.sub{color:#999;margin:0 0 28px}
.q{margin-bottom:22px}
.q h2{font-size:16px;margin:0 0 10px}
button{background:#222;color:#eee;border:1px solid #444;border-radius:999px;padding:8px 16px;margin:0 8px 8px 0;font-size:14px;cursor:pointer;font-family:inherit}
button.on{background:#eee;color:#111;border-color:#eee}
.go{background:#eee;color:#111;border:none;font-weight:bold;padding:12px 24px;margin-top:8px}
#out{margin-top:32px}
.card{border-left:3px solid #555;padding:4px 0 4px 16px;margin-bottom:22px}
.qt{display:block;font-size:18px}
.au{color:#999;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Quote Finder</h1>
<p class="sub">Answer 3 questions and I will pull the quotes that fit.</p>
<div id="quiz"></div>
<button class="go" onclick="find()">Find my quotes</button>
<div id="out"></div>
</div>
<script>
var questions=[
{k:"mood",label:"How are you feeling?",opts:["heavy","hopeful","chaotic"]},
{k:"theme",label:"What is on your mind?",opts:["love","grit","growing up","freedom"]},
{k:"tone",label:"What tone do you want?",opts:["serious","funny"]}
];
var quotes=[
{t:"The obstacle is the way.",a:"Marcus Aurelius",tags:["hopeful","grit","serious"]},
{t:"We suffer more often in imagination than in reality.",a:"Seneca",tags:["heavy","grit","serious"]},
{t:"You have power over your mind, not outside events.",a:"Marcus Aurelius",tags:["hopeful","grit","serious"]},
{t:"Waste no more time arguing what a good man should be. Be one.",a:"Marcus Aurelius",tags:["hopeful","grit","serious"]},
{t:"Luck is what happens when preparation meets opportunity.",a:"Seneca",tags:["hopeful","grit","serious"]},
{t:"The best revenge is to be unlike him who performed the injury.",a:"Marcus Aurelius",tags:["heavy","freedom","serious"]},
{t:"While we wait for life, life passes.",a:"Seneca",tags:["heavy","growing up","serious"]},
{t:"No man is free who is not master of himself.",a:"Epictetus",tags:["hopeful","freedom","serious"]},
{t:"First say to yourself what you would be, then do what you have to do.",a:"Epictetus",tags:["hopeful","growing up","serious"]},
{t:"People are not disturbed by things, but by the view they take of them.",a:"Epictetus",tags:["heavy","love","serious"]},
{t:"You could leave life right now. Let that determine what you do and say and think.",a:"Marcus Aurelius",tags:["chaotic","freedom","serious"]},
{t:"It is not death a man should fear, but he should fear never beginning to live.",a:"Marcus Aurelius",tags:["heavy","growing up","serious"]},
{t:"I can resist everything except temptation.",a:"Oscar Wilde",tags:["chaotic","love","funny"]},
{t:"Always forgive your enemies; nothing annoys them so much.",a:"Oscar Wilde",tags:["chaotic","freedom","funny"]},
{t:"I am not young enough to know everything.",a:"Oscar Wilde",tags:["chaotic","growing up","funny"]},
{t:"Life is far too important a thing ever to talk seriously about.",a:"Oscar Wilde",tags:["chaotic","love","funny"]}
];
var picks={};
var q=document.getElementById("quiz");
for(var i=0;i<questions.length;i++){
var Q=questions[i];
var d=document.createElement("div");d.className="q";
var h=document.createElement("h2");h.textContent=Q.label;d.appendChild(h);
for(var j=0;j<Q.opts.length;j++){(function(Q,opt){
var b=document.createElement("button");b.textContent=opt;
b.onclick=function(){picks[Q.k]=opt;var sib=d.getElementsByTagName("button");
for(var n=0;n<sib.length;n++){sib[n].className="";}b.className="on";};
d.appendChild(b);})(Q,Q.opts[j]);}
q.appendChild(d);}
function find(){
var want=[];for(var k in picks){want.push(picks[k]);}
if(want.length<questions.length){document.getElementById("out").innerHTML='<p class="none">Answer all 3 first.</p>';return;}
var hits=quotes.map(function(x){var s=0;for(var i=0;i<x.tags.length;i++){if(want.indexOf(x.tags[i])>-1)s++;}return{x:x,s:s};});
var best=hits.filter(function(h){return h.s>=2;});
if(!best.length){best=hits.filter(function(h){return h.s>=1;});}
best.sort(function(a,b){return b.s-a.s;});
var out=document.getElementById("out");
if(!best.length){out.innerHTML='<p class="none">No match. Try different answers.</p>';return;}
var html="";
for(var i=0;i<best.length;i++){html+='<div class="card"><span class="qt">'+best[i].x.t+'</span><span class="au">'+best[i].x.a+'</span></div>';}
out.innerHTML=html;}
</script>
</body>
</html>
