<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Finder</title>
<style>
body{font-family:Georgia,serif;background:#111;color:#eee;margin:0;padding:32px 20px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:28px;margin:0 0 8px}
.sub{color:#999;margin:0 0 28px}
.q{margin-bottom:22px}
.q h2{font-size:16px;margin:0 0 10px}
button{background:#222;color:#eee;border:1px solid #444;border-radius:999px;padding:8px 16px;margin:0 8px 8px 0;font-size:14px;cursor:pointer;font-family:inherit}
button.on{background:#eee;color:#111;border-color:#eee}
.go{background:#eee;color:#111;border:none;font-weight:bold;padding:12px 24px;margin-top:8px}
#out{margin-top:32px}
.card{border-left:3px solid #555;padding:4px 0 4px 16px;margin-bottom:22px}
.qt{display:block;font-size:18px}
.au{color:#999;font-size:14px}
.none{color:#f66}
</style>
</head>
<body>
<div class="wrap">
<h1>Quote Finder</h1>
<p class="sub">Answer 3 questions and I will pull the quotes that fit.</p>
<div id="quiz"></div>
<button class="go" onclick="find()">Find my quotes</button>
<div id="out"></div>
</div>
<script>
var questions=[
  {k:"mood",label:"How are you feeling?",opts:["heavy","hopeful","chaotic"]},
  {k:"theme",label:"What is on your mind?",opts:["love","grit","growing up","freedom"]},
  {k:"tone",label:"What tone do you want?",opts:["serious","funny"]}
];

var picks={};
var q=document.getElementById("quiz");
for(var i=0;i<questions.length;i++){
  var Q=questions[i];
  var d=document.createElement("div");d.className="q";
  var h=document.createElement("h2");h.textContent=Q.label;d.appendChild(h);
  for(var j=0;j<Q.opts.length;j++){(function(Q,opt){
    var b=document.createElement("button");b.textContent=opt;
    b.onclick=function(){picks[Q.k]=opt;var sib=d.getElementsByTagName("button");
      for(var n=0;n<sib.length;n++){sib[n].className="";}b.className="on";};
    d.appendChild(b);})(Q,Q.opts[j]);
  }
  q.appendChild(d);
}

/*
  fetch quotes from Quotable (no API key required):
  docs: https://github.com/lukePeavey/quotable
  We'll use the query parameter to search the quote text for the user's picks.
*/
async function find(){
  var want=[]; for(var k in picks){ want.push(picks[k]); }
  var out=document.getElementById("out");
  if(want.length<questions.length){ out.innerHTML='<p class="none">Answer all 3 first.</p>'; return; }

  // Build a simple search query from the selected words
  var query = want.join(' '); // e.g. "hopeful love serious"
  out.innerHTML = '<p>Loading quotes…</p>';

  // Use Quotable public API
  var url = 'https://api.quotable.io/quotes?query=' + encodeURIComponent(query) + '&limit=20';

  try {
    var res = await fetch(url);
    if(!res.ok) throw new Error('API error: ' + res.status);
    var data = await res.json();
    var results = data.results || [];

    // If no results, try a broader search by using just the theme
    if(results.length === 0 && picks.theme){
      var fallbackUrl = 'https://api.quotable.io/quotes?query=' + encodeURIComponent(picks.theme) + '&limit=20';
      var fres = await fetch(fallbackUrl);
      if(fres.ok){
        var fdata = await fres.json();
        results = fdata.results || [];
      }
    }

    if(results.length === 0){
      out.innerHTML = '<p class="none">No match. Try different answers.</p>';
      return;
    }

    // Render results
    var html = '';
    for(var i=0;i<results.length;i++){
      var r = results[i];
      html += '<div class="card"><span class="qt">' + escapeHtml(r.content) + '</span><span class="au"> — ' + escapeHtml(r.author) + '</span></div>';
    }
    out.innerHTML = html;
  } catch(err){
    console.error(err);
    out.innerHTML = '<p class="none">Error fetching quotes. Try again later.</p>';
  }
}

// small helper to avoid HTML injection
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(m){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
  });
}
</script>
</body>
</html>
