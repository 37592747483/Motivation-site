<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Finder</title>
<style>
body{font-family:Georgia,serif;background:#111;color:#eee;margin:0;padding:32px 20px;line-height:1.5}
.wrap{max-width:800px;margin:0 auto}
h1{font-size:28px;margin:0 0 8px}
.sub{color:#999;margin:0 0 12px}
.q{margin-bottom:18px}
.q h2{font-size:16px;margin:0 0 10px}
.opt{display:inline-block}
button.opt{background:#222;color:#eee;border:1px solid #444;border-radius:999px;padding:8px 16px;margin:0 8px 8px 0;font-size:14px;cursor:pointer;font-family:inherit}
button.opt.on{background:#eee;color:#111;border-color:#eee}
button.go{background:#0b84ff;color:#fff;border:none;border-radius:8px;padding:10px 18px;margin-top:8px;font-weight:600;cursor:pointer}
#out{margin-top:20px}
.card{border-left:3px solid #555;padding:8px 12px;margin-bottom:12px;background:rgba(255,255,255,0.02)}
.qt{display:block;font-size:18px}
.au{color:#999;font-size:14px}
.none{color:#f66}
.controls{margin:12px 0 18px}
.small{color:#999;font-size:13px}
.copy{background:#222;color:#fff;border:1px solid #444;padding:6px 10px;border-radius:6px;cursor:pointer;margin-left:8px}
.loadMore{background:#333;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;margin-top:8px}
.status{color:#ccc;margin-top:8px}
.retry{background:#ff6b6b;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Quote Finder</h1>
<p class="sub">Answer 3 questions and I'll find quotes that match. Selections are saved locally so you can come back.</p>
<div id="quiz" role="radiogroup" aria-label="Quote options"></div>
<div class="controls">
  <button class="go" id="searchBtn">Find my quotes</button>
  <span class="small" id="summary">(choose 3 answers)</span>
</div>
<div id="out" aria-live="polite"></div>
</div>
<script>
var questions=[
  {k:"mood",label:"How are you feeling?",opts:["heavy","hopeful","chaotic"]},
  {k:"theme",label:"What is on your mind?",opts:["love","grit","growing up","freedom"]},
  {k:"tone",label:"What tone do you want?",opts:["serious","funny"]}
];

var picks={};
var limit = 6;
var page = 1;
var totalCount = 0;
var lastQuery = '';

// a much longer fallback pool so the offline/mobile experience feels varied
var fallbackQuotes = [
  {text:"The only way to do great work is to love what you do.", author:"Steve Jobs", tags:["hopeful","love","serious"]},
  {text:"It does not matter how slowly you go as long as you do not stop.", author:"Confucius", tags:["grit","hopeful","serious"]},
  {text:"You are never too old to set another goal or to dream a new dream.", author:"C.S. Lewis", tags:["growing up","hopeful","serious"]},
  {text:"Freedom is the oxygen of the soul.", author:"Moshe Dayan", tags:["freedom","heavy","serious"]},
  {text:"Love is the greatest refreshment in life.", author:"Pablo Picasso", tags:["love","hopeful","funny"]},
  {text:"If you want to fly, give up everything that weighs you down.", author:"Unknown", tags:["freedom","grit","serious"]},
  {text:"Life is like riding a bicycle. To keep your balance, you must keep moving.", author:"Albert Einstein", tags:["growing up","hopeful","funny"]},
  {text:"The future depends on what you do today.", author:"Mahatma Gandhi", tags:["grit","hopeful","serious"]},
  {text:"In the middle of difficulty lies opportunity.", author:"Albert Einstein", tags:["heavy","grit","serious"]},
  {text:"The secret of getting ahead is getting started.", author:"Mark Twain", tags:["hopeful","growing up","funny"]},
  {text:"Don't watch the clock; do what it does. Keep going.", author:"Sam Levenson", tags:["grit","hopeful","serious"]},
  {text:"You miss 100% of the shots you don't take.", author:"Wayne Gretzky", tags:["grit","hopeful","funny"]},
  {text:"Do what you can, with what you have, where you are.", author:"Theodore Roosevelt", tags:["grit","hopeful","serious"]},
  {text:"Be yourself; everyone else is already taken.", author:"Oscar Wilde", tags:["growing up","funny","hopeful"]},
  {text:"Act as if what you do makes a difference. It does.", author:"William James", tags:["hopeful","grit","serious"]},
  {text:"What you get by achieving your goals is not as important as what you become by achieving your goals.", author:"Zig Ziglar", tags:["growing up","grit","serious"]},
  {text:"The best way out is always through.", author:"Robert Frost", tags:["grit","heavy","serious"]},
  {text:"Happiness depends upon ourselves.", author:"Aristotle", tags:["hopeful","growing up","serious"]},
  {text:"Believe you can and you're halfway there.", author:"Theodore Roosevelt", tags:["hopeful","grit","serious"]},
  {text:"You must be the change you wish to see in the world.", author:"Mahatma Gandhi", tags:["freedom","hopeful","serious"]},
  {text:"Tough times never last, but tough people do.", author:"Robert Schuller", tags:["grit","heavy","serious"]},
  {text:"Imperfection is beauty, madness is genius and it's better to be absolutely ridiculous than absolutely boring.", author:"Marilyn Monroe", tags:["funny","love","growing up"]},
  {text:"Everything you can imagine is real.", author:"Pablo Picasso", tags:["hopeful","freedom","funny"]},
  {text:"It always seems impossible until it's done.", author:"Nelson Mandela", tags:["grit","hopeful","serious"]},
  {text:"Strive not to be a success, but rather to be of value.", author:"Albert Einstein", tags:["growing up","serious","hopeful"]},
  {text:"A room without books is like a body without a soul.", author:"Marcus Tullius Cicero", tags:["growing up","serious","heavy"]},
  {text:"To live is the rarest thing in the world. Most people exist, that is all.", author:"Oscar Wilde", tags:["growing up","heavy","funny"]},
  {text:"You only live once, but if you do it right, once is enough.", author:"Mae West", tags:["funny","hopeful","freedom"]},
  {text:"The purpose of our lives is to be happy.", author:"Dalai Lama", tags:["hopeful","growing up","serious"]},
  {text:"Keep your face always toward the sunshine—and shadows will fall behind you.", author:"Walt Whitman", tags:["hopeful","love","serious"]}
];

// restore picks from localStorage if present
try{ var saved = localStorage.getItem('quote-picks'); if(saved){ picks = JSON.parse(saved);} }catch(e){ /* ignore */ }

var q=document.getElementById("quiz");
function buildQuiz(){
  q.innerHTML = '';
  for(var i=0;i<questions.length;i++){
    var Q=questions[i];
    var d=document.createElement("div");d.className="q";
    var h=document.createElement("h2");h.textContent=Q.label;d.appendChild(h);
    for(var j=0;j<Q.opts.length;j++){(function(Q,opt){
      var span=document.createElement('span');span.className='opt';
      var b=document.createElement("button");b.className='opt';b.textContent=opt; b.setAttribute('role','radio');
      b.setAttribute('aria-checked','false');
      // keyboard support
      b.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); b.click(); } });
      b.onclick=function(){ picks[Q.k]=opt; persistPicks(); updateButtons(d,opt); };
      span.appendChild(b);
      d.appendChild(span);
      // restore selection if present
      if(picks[Q.k]===opt){ setTimeout(function(){ b.classList.add('on'); b.setAttribute('aria-checked','true'); },0); }
    })(Q,Q.opts[j]);}
    q.appendChild(d);
  }
  updateSummary();
}

function updateButtons(container,selected){
  var sib=container.getElementsByTagName('button');
  for(var n=0;n<sib.length;n++){ sib[n].classList.remove('on'); sib[n].setAttribute('aria-checked','false'); }
  for(var n=0;n<sib.length;n++){ if(sib[n].textContent===selected){ sib[n].classList.add('on'); sib[n].setAttribute('aria-checked','true'); } }
  updateSummary();
}

function persistPicks(){
  try{ localStorage.setItem('quote-picks', JSON.stringify(picks)); }catch(e){ /* noop */ }
}

function updateSummary(){
  var cnt = 0; for(var k in picks) if(picks[k]) cnt++;
  document.getElementById('summary').textContent = '('+cnt+' of '+questions.length+' chosen)';
}

buildQuiz();

function fetchWithTimeout(url, opts, timeoutMs){
  var controller = new AbortController();
  var id = setTimeout(function(){ controller.abort(); }, timeoutMs||10000);
  return fetch(url, Object.assign({}, opts||{}, {signal: controller.signal})).finally(function(){ clearTimeout(id); });
}

// shuffle helper (Fisher-Yates)
function shuffleArray(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function scoreFallbackQuote(item){
  var score = 0;
  var mood = picks.mood || '';
  var theme = picks.theme || '';
  var tone = picks.tone || '';
  if(item.tags && item.tags.indexOf(mood) !== -1) score += 4;
  if(item.tags && item.tags.indexOf(theme) !== -1) score += 4;
  if(item.tags && item.tags.indexOf(tone) !== -1) score += 3;
  // small random jitter so equal-score items don't always sort the same
  score += Math.random()*0.1;
  return score;
}

function renderFallbackQuotes(){
  // shuffle the pool so reloads look different
  var shuffledPool = shuffleArray(fallbackQuotes);
  // score and select top N (N varies slightly for variety)
  var scored = shuffledPool.map(function(item){ return {item:item, score:scoreFallbackQuote(item)}; });
  scored.sort(function(a,b){ return b.score - a.score; });
  var pickCount = 6 + Math.floor(Math.random()*5); // 6..10
  var items = scored.slice(0,pickCount).map(function(e){ return e.item; });

  var html = '';
  for(var i=0;i<items.length;i++){
    var r = items[i];
    html += '<div class="card"><span class="qt">' + escapeHtml(r.text) + '</span><span class="au"> — ' + escapeHtml(r.author) + '</span></div>';
  }
  document.getElementById('out').innerHTML = '<div class="small">Showing offline fallback quotes</div>' + html;
}

async function find(reset){
  if(reset===undefined) reset = true;
  if(reset){ page = 1; totalCount = 0; lastQuery = ''; document.getElementById('out').innerHTML=''; }
  var want=[]; for(var k in picks){ if(picks[k]) want.push(picks[k]); }
  var out=document.getElementById("out");
  if(want.length<questions.length){ out.innerHTML='<p class="none">Answer all 3 first.</p>'; return; }

  var query = want.join(' ');
  lastQuery = query;
  out.innerHTML = '<p class="status">Loading quotes…</p>';
  var url = 'https://api.quotable.io/search/quotes?query=' + encodeURIComponent(query) + '&limit=' + limit + '&page=' + page;

  try {
    if(!navigator.onLine){ renderFallbackQuotes(); return; }
    var res = await fetchWithTimeout(url, {mode:'cors'}, 10000);
    if(!res.ok){
      var details = '';
      try { details = await res.text(); details = details.substring(0,250); } catch(e){ /* ignore */ }
      throw new Error('API error: ' + res.status + ' ' + (res.statusText||'') + (details?(' — '+details):''));
    }

    var data = await res.json();
    var results = data.results || [];
    totalCount = data.totalCount || results.length || 0;

    if(results.length === 0 && picks.theme && query !== picks.theme){
      var fallbackUrl = 'https://api.quotable.io/search/quotes?query=' + encodeURIComponent(picks.theme) + '&limit=' + limit + '&page=1';
      var fres = await fetchWithTimeout(fallbackUrl, {mode:'cors'}, 10000);
      if(fres.ok){ var fdata = await fres.json(); results = fdata.results || []; totalCount = fdata.totalCount || results.length || 0; }
    }

    if(results.length === 0){
      renderFallbackQuotes();
      return;
    }

    // randomize API results order slightly so it's not identical every time
    results = shuffleArray(results);

    var html = '';
    for(var i=0;i<results.length;i++){
      var r = results[i];
      html += '<div class="card"><span class="qt">' + escapeHtml(r.content) + '</span><span class="au"> — ' + escapeHtml(r.author) + '</span>' +
              '<button class="copy" data-quote="' + escapeHtmlAttr(r.content + ' — ' + r.author) + '">Copy</button></div>';
    }

    if(page===1){ out.innerHTML = '<div class="small">Found ' + totalCount + ' quotes matching "' + escapeHtml(query) + '"</div>' + html; }
    else { out.innerHTML = out.innerHTML + html; }

    var loadMoreNode = document.getElementById('loadMoreBtn'); if(loadMoreNode) loadMoreNode.remove();
    if(page * limit < totalCount){
      var lm = document.createElement('button'); lm.textContent = 'Load more'; lm.className='loadMore'; lm.id='loadMoreBtn';
      lm.onclick = function(){ page++; find(false); };
      out.appendChild(lm);
    }

    var copies = out.getElementsByClassName('copy');
    for(var c=0;c<copies.length;c++){
      copies[c].onclick = function(e){ var txt = this.getAttribute('data-quote'); if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ showToast('Copied to clipboard'); }, function(){ fallbackCopy(txt); }); } else { fallbackCopy(txt); }};
    }

  } catch(err){
    console.error('Quote fetch failed:', err);
    renderFallbackQuotes();
  }
}

function showToast(msg){ var s = document.createElement('div'); s.textContent = msg; s.style.position='fixed'; s.style.right='20px'; s.style.bottom='20px'; s.style.background='#222'; s.style.color='#fff'; s.style.padding='8px 12px'; s.style.borderRadius='6px'; document.body.appendChild(s); setTimeout(function(){ s.remove(); },1600); }
function fallbackCopy(txt){ var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); showToast('Copied to clipboard'); }catch(e){ showToast('Copy failed'); } ta.remove(); }
function escapeHtml(str){ return String(str).replace(/[&<>\"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]); }); }
function escapeHtmlAttr(str){ return String(str).replace(/[&<>\"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]); }); }

document.getElementById('searchBtn').addEventListener('click', function(){ page = 1; find(true); });
(function runStaticChecks(){
  var src = document.documentElement.innerHTML;
  var checks = {
    hasFind: /function\s+find\(/.test(src),
    hasSearchEndpoint: /search\/quotes/.test(src),
    hasLocalStorage: /localStorage/.test(src),
    hasFallbackQuotes: /fallbackQuotes/.test(src)
  };
  console.log('Static checks', checks);
})();
</script>
</body>
</html>
